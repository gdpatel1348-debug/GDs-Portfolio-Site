<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absolute Cinema Portfolio</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-text">Loading 0%</div>
    <div class="loader-bar-bg"><div class="loader-bar-fill"></div></div>
  </div>

  <!-- Cinematic Start Overlay -->
  <div id="start-overlay" class="start-overlay" style="display: none;">
     <button id="cinematic-start-btn" class="cinematic-start-btn">START</button>
  </div>
  
  <!-- Scene Transition Fade -->
  <div class="scene-fade"></div>

  <!-- Debug Console -->
  <div id="debug-panel">
    <div>FPS: <span id="debug-fps">0</span></div>
    <div>Current Frame: <span id="debug-curr">0</span></div>
    <div>Target: <span id="debug-target">0</span></div>
    <div>Scene: <span id="debug-scene">0</span></div>
  </div>

  <!-- Canvas Container -->
  <div class="canvas-container">
    <canvas id="cinema-canvas"></canvas>
    <div class="vignette"></div>
    <div class="film-grain"></div>
  </div>

  <!-- Cinematic Text Nodes Layer -->
  <div id="text-container"></div>

  <!-- Scroll Inducer -->
  <div class="scroll-track"></div>

  <div id="audio-hint">Scroll down to explore</div>

  <!-- Sound Toggle Button -->
  <button id="sound-toggle" class="sound-button">SOUND: OFF</button>

  <!-- Lenis Smooth Scroll Engine -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- GSAP Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <script src="main.js"></script>
</body>
</html>
